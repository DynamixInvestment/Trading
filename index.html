<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dynamix Investment · Journal de trading</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--b:#004BAE;--bd:#0A2A5E;--bg:#F3F6FA;--card:#fff;--ink:#14213A;--mute:#667794;--line:#DAE1EC;--g:#0B7A63;--r:#C0344A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.top{background:#fff;border-bottom:3px solid var(--b);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top img{height:44px;display:block}
main{max-width:800px;margin:0 auto;padding:16px 14px 48px}
h2{font-size:16px;margin:0 0 10px;color:var(--bd)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.gain{color:var(--g)}.loss{color:var(--r)}.num{font-variant-numeric:tabular-nums}
.meta{color:var(--mute);font-size:13px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.big{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
svg.eq{width:100%;height:100px;display:block;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:12px}
.stats div{background:#fff;padding:8px 10px}.stats b{display:block;font-size:16px}.stats span{font-size:12px;color:var(--mute)}
form,.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:3px}
.full{grid-column:1/-1}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--b)}
.chk{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink)}.chk input{width:auto}
button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px}
button.pri{background:var(--b);border-color:var(--b);color:#fff;font-weight:600}
button:disabled{opacity:.6;cursor:wait}
.trade{border-top:1px solid var(--line);padding:10px 0;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.trade:first-of-type{border-top:0}.pl{font-size:18px;font-weight:800;text-align:right}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:20px;padding:0 8px;margin:4px 4px 0 0}
.del{border:0;background:none;color:var(--mute);padding:0;font-size:13px;text-decoration:underline}
#st{font-size:13px;color:var(--mute)}.err{color:var(--r)!important}
#login{max-width:340px;margin:60px auto;text-align:center}
.hide{display:none!important}
</style>
</head>
<body>
<div class="top"><img src="logo.png" alt="Dynamix Investment"><span id="st"></span></div>

<main id="login" class="panel">
  <h2>Accès au journal</h2>
  <p class="meta">Entre ton mot de passe personnel.</p>
  <input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password">
  <p id="lerr" class="meta err"></p>
  <button class="pri" id="go" style="width:100%">Se connecter</button>
</main>

<main id="app" class="hide">
  <section class="panel">
    <div class="hero">
      <div><div class="meta">P&amp;L total</div><div class="big num" id="total">0</div></div>
      <label>Capital de départ <input id="cap" type="number" step="any" style="width:110px"></label>
    </div>
    <svg class="eq" id="eq" viewBox="0 0 300 100" preserveAspectRatio="none"></svg>
    <div class="stats" id="stats"></div>
  </section>

  <section class="panel">
    <h2>Relevé PDF</h2>
    <div class="grid">
      <label>Du<input type="date" id="from"></label>
      <label>Au<input type="date" id="to"></label>
      <label>Devise<input id="cur" value="€" maxlength="4"></label>
      <button class="pri" id="pdf" style="align-self:end">Télécharger le relevé</button>
    </div>
  </section>

  <section class="panel">
    <h2>Nouveau trade</h2>
    <form id="f">
      <label>Date<input type="date" id="date" required></label>
      <label>Actif<input id="asset" placeholder="EUR/USD, BTC, AAPL…" required></label>
      <label>Direction<select id="dir"><option value="long">Achat (long)</option><option value="short">Vente (short)</option></select></label>
      <label>Taille / quantité<input id="size" type="number" step="any" inputmode="decimal" required></label>
      <label>Prix d’entrée<input id="entry" type="number" step="any" inputmode="decimal" required></label>
      <label>Prix de sortie<input id="exit" type="number" step="any" inputmode="decimal" required></label>
      <label>Stop-loss (optionnel)<input id="stop" type="number" step="any" inputmode="decimal"></label>
      <label>Frais (optionnel)<input id="fees" type="number" step="any" inputmode="decimal"></label>
      <label>Stratégie<input id="strat"></label>
      <label>État d’esprit<select id="emo"><option>Calme</option><option>Confiant</option><option>Impatient</option><option>Peur</option><option>Avidité</option><option>Revanche</option></select></label>
      <label class="chk full"><input type="checkbox" id="plan" checked> J’ai respecté mon plan</label>
      <label class="full">Notes / leçon retenue<textarea id="notes" rows="2"></textarea></label>
      <button class="pri full" id="save" type="submit">Enregistrer le trade</button>
    </form>
  </section>

  <section class="panel"><h2>Historique</h2><div id="list"></div></section>
</main>

<script>
// ====== CONFIG : colle ici l'URL de ton déploiement Apps Script (voir README) ======
var API='https://script.google.com/macros/s/AKfycbxkExj7_6uQ-88kciu9nb_rlubm_H60O-K5fDLAjdwBep1kV-kRnVLigWUqIbOI5zSR/exec';
// ===================================================================================
var KEY='',T=[],CAP=1000;
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function f2(n){return n.toLocaleString('fr-FR',{maximumFractionDigits:2})}
function sg(n){return (n>0?'+':n<0?'−':'')+f2(Math.abs(n))}
function cl(n){return n>0?'gain':n<0?'loss':''}
function st(m,e){var s=$('st');s.textContent=m;s.className=e?'err':''}
function calc(t){var p=(t.direction==='long'?t.sortie-t.entree:t.entree-t.sortie)*t.taille-(t.frais||0),r=null;if(t.stop){var k=Math.abs(t.entree-t.stop)*t.taille;if(k>0)r=p/k}return{p:p,r:r}}
function norm(o){return{id:String(o.id),date:String(o.date).slice(0,10),actif:o.actif,direction:o.direction,taille:+o.taille,entree:+o.entree,sortie:+o.sortie,stop:o.stop===''||o.stop==null?null:+o.stop,frais:+o.frais||0,strategie:o.strategie||'',emotion:o.emotion||'',plan:o.plan==='oui'||o.plan===true,notes:o.notes||''}}
function api(body){return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({key:KEY},body))}).then(function(r){return r.json()}).then(function(d){if(d.error)throw new Error(d.error);return d})}
function load(){
  st('Synchronisation…');
  return fetch(API+'?key='+encodeURIComponent(KEY)).then(function(r){return r.json()}).then(function(d){
    if(d.error)throw new Error(d.error);
    T=d.trades.map(norm);CAP=+d.cap||0;$('cap').value=CAP;st('Synchronisé ✓');render();
  });
}
function sorted(l){return l.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.id<b.id?-1:1)})}
function stats(l,start){
  var o={n:l.length,w:0,gw:0,gl:0,tot:0,dd:0,eq:[start],rs:[]},c=start,pk=start;
  l.forEach(function(t){var x=calc(t);t._p=x.p;t._r=x.r;o.tot+=x.p;if(x.p>0){o.w++;o.gw+=x.p}else if(x.p<0)o.gl-=x.p;if(x.r!==null)o.rs.push(x.r);c+=x.p;o.eq.push(c);pk=Math.max(pk,c);o.dd=Math.max(o.dd,pk-c)});
  o.l=l.filter(function(t){return t._p<0}).length;o.end=c;return o;
}
function render(){
  var rows=sorted(T),s=stats(rows,CAP);
  var te=$('total');te.textContent=sg(s.tot);te.className='big num '+cl(s.tot);
  var ar=s.rs.length?s.rs.reduce(function(a,b){return a+b},0)/s.rs.length:null;
  var it=[['Trades',s.n],['Réussite',s.n?Math.round(s.w/s.n*100)+' %':'–'],['Profit factor',s.gl>0?f2(s.gw/s.gl):'–'],['Gain moyen',s.w?sg(s.gw/s.w):'–'],['Perte moyenne',s.l?sg(-s.gl/s.l):'–'],['R moyen',ar!==null?f2(ar)+' R':'–']];
  $('stats').innerHTML=it.map(function(i){return '<div><b class="num">'+esc(i[1])+'</b><span>'+i[0]+'</span></div>'}).join('');
  var v=$('eq');
  if(s.eq.length<2)v.innerHTML='';else{var mn=Math.min.apply(null,s.eq),mx=Math.max.apply(null,s.eq);if(mx===mn){mx++;mn--}
    v.innerHTML='<polyline fill="none" stroke="'+(s.tot>=0?'#0B7A63':'#C0344A')+'" stroke-width="2" vector-effect="non-scaling-stroke" points="'+s.eq.map(function(y,i){return (i/(s.eq.length-1)*300).toFixed(1)+','+(95-(y-mn)/(mx-mn)*88).toFixed(1)}).join(' ')+'"/>'}
  $('list').innerHTML=rows.length?rows.slice().reverse().map(function(t){
    return '<div class="trade"><div><b>'+esc(t.actif)+'</b> <span class="meta">'+(t.direction==='long'?'Achat':'Vente')+' · '+t.date.split('-').reverse().join('/')+'</span></div><div class="pl num '+cl(t._p)+'">'+sg(t._p)+'</div>'
    +'<div class="meta num">'+f2(t.taille)+' @ '+f2(t.entree)+' → '+f2(t.sortie)+(t._r!==null?' · '+f2(t._r)+' R':'')+'</div><div style="text-align:right"><button class="del" data-id="'+esc(t.id)+'">Supprimer</button></div>'
    +'<div style="grid-column:1/-1"><span class="tag">'+esc(t.emotion)+'</span>'+(t.strategie?'<span class="tag">'+esc(t.strategie)+'</span>':'')+'<span class="tag">'+(t.plan?'Plan respecté':'Hors plan')+'</span>'+(t.notes?'<div class="meta" style="margin-top:5px">'+esc(t.notes)+'</div>':'')+'</div></div>'}).join(''):'<div class="meta">Aucun trade pour l’instant.</div>';
}
// ---------- Connexion ----------
function login(){
  if(API.indexOf('http')!==0){$('lerr').textContent='URL Apps Script non configurée (voir README).';return}
  KEY=$('pw').value;$('lerr').textContent='';
  load().then(function(){try{localStorage.setItem('dx-key',KEY)}catch(e){}$('login').classList.add('hide');$('app').classList.remove('hide')})
  .catch(function(e){$('lerr').textContent=e.message==='auth'?'Mot de passe incorrect.':'Connexion impossible.';st('')});
}
$('go').onclick=login;$('pw').onkeydown=function(e){if(e.key==='Enter')login()};
try{var k=localStorage.getItem('dx-key');if(k){$('pw').value=k;if(API.indexOf('http')===0)login()}var c=localStorage.getItem('dx-cur');if(c)$('cur').value=c}catch(e){}
// ---------- Actions ----------
var today=new Date().toISOString().slice(0,10);$('date').value=today;$('to').value=today;$('from').value=today.slice(0,8)+'01';
$('f').onsubmit=function(e){
  e.preventDefault();var v=function(i){return $(i).value===''?'':+$(i).value},b=$('save');b.disabled=true;st('Enregistrement…');
  var t={id:String(Date.now()),date:$('date').value,actif:$('asset').value.trim(),direction:$('dir').value,taille:v('size'),entree:v('entry'),sortie:v('exit'),stop:v('stop'),frais:v('fees')||0,strategie:$('strat').value.trim(),emotion:$('emo').value,plan:$('plan').checked?'oui':'non',notes:$('notes').value.trim()};
  api({action:'add',trade:t}).then(function(){T.push(norm(t));render();st('Enregistré ✓');['asset','size','entry','exit','stop','fees','notes'].forEach(function(i){$(i).value=''})})
  .catch(function(){st('Échec de l’enregistrement',1)}).then(function(){b.disabled=false});
};
$('list').onclick=function(e){var id=e.target.getAttribute&&e.target.getAttribute('data-id');
  if(id&&confirm('Supprimer ce trade ?'))api({action:'delete',id:id}).then(function(){T=T.filter(function(t){return t.id!==id});render();st('Supprimé ✓')}).catch(function(){st('Échec de la suppression',1)})};
$('cap').onchange=function(){CAP=+$('cap').value||0;render();api({action:'cap',cap:CAP}).then(function(){st('Capital enregistré ✓')}).catch(function(){st('Échec',1)})};
$('cur').oninput=function(){try{localStorage.setItem('dx-cur',$('cur').value)}catch(e){}};
// ---------- PDF institutionnel ----------
function pf(n){return n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}).replace(/[\u202f\u00a0]/g,' ')}
function ps(n){return (n>0?'+':n<0?'-':'')+pf(Math.abs(n))}
function fd(s){return s.split('-').reverse().join('/')}
function img(src){return new Promise(function(ok,ko){var i=new Image();i.onload=function(){ok(i)};i.onerror=ko;i.src=src})}
$('pdf').onclick=function(){
  var from=$('from').value,to=$('to').value,cur=$('cur').value||'';
  if(!from||!to||from>to){alert('Choisis une période valide.');return}
  var before=sorted(T).filter(function(t){return t.date<from}),per=sorted(T).filter(function(t){return t.date>=from&&t.date<=to});
  if(!per.length){alert('Aucun trade sur cette période.');return}
  var open=stats(before,CAP).end,s=stats(per,open);
  img('logo.png').then(function(lg){
    var d=new jspdf.jsPDF({unit:'mm',format:'a4'}),W=210,B=[0,75,174],N=[10,42,94],lw=58;
    d.addImage(lg,'PNG',14,12,lw,lw*lg.naturalHeight/lg.naturalWidth);
    d.setTextColor.apply(d,N);d.setFont('helvetica','bold').setFontSize(14).text('RELEVÉ DE JOURNAL DE TRADING',W-14,18,{align:'right'});
    d.setFont('helvetica','normal').setFontSize(9.5).setTextColor(90,105,130);
    d.text('Période du '+fd(from)+' au '+fd(to),W-14,24,{align:'right'});d.text('Émis le '+fd(today),W-14,29,{align:'right'});
    d.setDrawColor.apply(d,B);d.setLineWidth(.8).line(14,36,W-14,36);
    var wr=s.n?Math.round(s.w/s.n*100)+' %':'-',pfac=s.gl>0?pf(s.gw/s.gl):'-';
    var boxes=[['Capital d\'ouverture',pf(open)+' '+cur],['Résultat net de la période',ps(s.tot)+' '+cur,s.tot],['Capital de clôture',pf(s.end)+' '+cur],['Nombre de trades',String(s.n)],
      ['Taux de réussite',wr],['Profit factor',pfac],['Gain / perte moyen',(s.w?ps(s.gw/s.w):'-')+' / '+(s.l?ps(-s.gl/s.l):'-')],['Drawdown maximum',s.dd?'-'+pf(s.dd):'0,00']];
    boxes.forEach(function(b,i){var x=14+(i%4)*46,y=42+Math.floor(i/4)*20;
      d.setFillColor(238,243,250).roundedRect(x,y,43,17,1.5,1.5,'F');
      d.setFont('helvetica','normal').setFontSize(7.5).setTextColor(100,115,140).text(b[0],x+3,y+6);
      var c=b[2]>0?[11,122,99]:b[2]<0?[192,52,74]:N;d.setFont('helvetica','bold').setFontSize(9.5).setTextColor.apply(d,c);d.text(b[1],x+3,y+13)});
    var bal=open,body=per.map(function(t){bal+=t._p;return [fd(t.date),t.actif,t.direction==='long'?'Achat':'Vente',pf(t.taille),pf(t.entree),pf(t.sortie),t._r!==null?pf(t._r):'-',ps(t._p),pf(bal)]});
    d.autoTable({startY:86,head:[['Date','Actif','Sens','Qté','Entrée','Sortie','R','Résultat','Solde']],body:body,
      foot:[['','','','','','','Total',ps(s.tot),pf(s.end)]],theme:'striped',showFoot:'lastPage',
      headStyles:{fillColor:B,textColor:255,fontSize:8.5},footStyles:{fillColor:N,textColor:255,fontSize:8.5},styles:{fontSize:8.5,cellPadding:2.2},
      alternateRowStyles:{fillColor:[245,248,252]},columnStyles:{3:{halign:'right'},4:{halign:'right'},5:{halign:'right'},6:{halign:'right'},7:{halign:'right'},8:{halign:'right'}},
      margin:{left:14,right:14,bottom:18},
      didParseCell:function(h){if(h.section==='body'&&h.column.index===7){h.cell.styles.textColor=h.cell.raw.charAt(0)==='-'?[192,52,74]:[11,122,99];h.cell.styles.fontStyle='bold'}}});
    var pg=d.getNumberOfPages();
    for(var p=1;p<=pg;p++){d.setPage(p);d.setDrawColor(200,210,225).setLineWidth(.3).line(14,282,W-14,282);
      d.setFont('helvetica','normal').setFontSize(7.5).setTextColor(110,125,150);
      d.text('Dynamix Investment · Document confidentiel à usage personnel, sans valeur de relevé bancaire officiel.',14,287);d.text('Page '+p+' / '+pg,W-14,287,{align:'right'})}
    d.save('Releve_Dynamix_'+from+'_'+to+'.pdf');
  }).catch(function(){alert('Impossible de générer le PDF (logo.png introuvable ?).')});
};
</script>
</body>
</html>
